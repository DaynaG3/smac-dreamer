# R2-2100 - finish_trade_v3 reward, FULL-OBSERVABILITY ablation.
#
#   python scripts/train_r2dreamer_smaclite_multimap.py --config configs/r2_2100_finish_trade_v3_fullobs.yaml \
#       --resume logs/r2dreamer/r2_2100_finish_trade_v3_from_best52/best_val_macro_winrate.pt \
#       --resume-mode weights_only --steps 1000000 \
#       --logdir logs/r2dreamer/r2_2100_finish_trade_v3_fullobs_from_best
#
# Oracle / upper-bound ablation: give the agent FULL map visibility and measure whether removing
# fog-of-war raises the held-out win rate. Identical to r2_2100_finish_trade_v3.yaml EXCEPT
# observation.sight_range (new), validation.run_at_start, and the W&B/logdir identity. Reward,
# gamma, max_episode_steps, model, action masking, and padding are UNCHANGED.
#
# Mechanism: observation.sight_range overrides SMAClite's AGENT_SIGHT_RANGE (default 9) via the
# SMACLITE_SIGHT_RANGE env var, inherited by every spawned train/validation/discovery child. 24
# covers every r2_2100 map (span <=~21), so all units are always visible. Accepted coupling:
# AGENT_SIGHT_RANGE is ALSO the distance-normalization divisor, so distance/dx/dy features are
# rescaled to 9/24 ~= 0.375x; the resume run fine-tunes the encoder to the new scale.
#
# RESUME MODE: weights_only (NOT full, NOT transfer_reward). The reward is unchanged so the
# reward/value heads stay useful (load all weights), but the observation distribution shifts, so
# reset the optimizer/scheduler/scaler (fresh momentum). Start a NEW W&B run: full-vis metrics are
# not comparable to the partial-obs axis. Checkpoint selection still uses ORIGINAL macro win rate.

maps:
  train:               configs/maps/r2_2100/configs/train
  validation:          configs/maps/r2_2100/configs/validation
  blind_iid:           configs/maps/r2_2100/configs/blind_iid
  blind_compositional: configs/maps/r2_2100/configs/blind_compositional

sampling_mode: prioritized_hard_maps    # 75% shuffled_round_robin + 25% hard-map oversampling

# ---- Adaptive hard-map curriculum -----------------------------------------
map_priority:
  enabled: true
  hard_map_probability: 0.30
  every: 50000
  warmup: 200000
  ema_decay: 0.95
  min_episodes: 5

# ---- Observation representation -------------------------------------------
observation:
  mode: structured
  sight_range: 24                        # full-visibility override (default SMAClite sight is 9)

# ---- Padding: pinned to the r2_2100 TRAIN-max the resume checkpoint was built against ----
padding:
  max_agents: 9
  max_enemies: 10
  max_actions: 16
  max_obs_size: 255

# ---- Action masking (P0.1 real; P0.2 imagined) ----------------------------
action_masking: true
mask_threshold: 0.7

# ---- Reward: finish_trade_v3 (UNCHANGED; selection still uses ORIGINAL return only) ----
reward:
  name: finish_trade_v3
  params:
    w_enemy_progress: 0.28
    w_ally_loss: 0.22

    progress_eps: 0.0005
    stall_grace: 10
    stall_cap: 50
    w_stall: 0.020

    w_timeout_enemy: 1.10
    w_timeout_alive: 0.30

    w_win_speed: 0.35
    w_win_ally_ehp: 0.60

    w_all_dead_loss: 0.90
    w_unfinished_close_loss: 0.20

# ---- Run / model knobs (GPU production) -----------------------------------
device: cuda:0
amp_dtype: bfloat16                     # A40/A100/L4. Use float16 on T4/V100.
seed: 0
gamma: 0.997
steps: 4000000                          # override with --steps for the pilot
env_num: 8
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15

# ---- Validation (checkpoint selection): map x fixed seeds - UNBIASED -------
validation:
  every: 250000
  run_at_start: true                     # full-vis baseline of the transferred weights at step 0
  seeds: [0, 1, 2]

# ---- Replay buffer: large capacity, CPU storage (model computes on cuda) ---
buffer:
  max_size: 1000000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay

# ---- Environment worker lifecycle / memory telemetry ----------------------
env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true

system_log_every: 10000

# ---- Logging --------------------------------------------------------------
wandb:
  project: smac-r2dreamer
  entity: null
  mode: online
  tags: [r2_2100, smaclite, multimap, prioritized_hard_maps, finish_trade_v3, full_observability]
  run_name: r2_2100_finish_trade_v3_fullobs_from_best
logdir: logs/r2dreamer/r2_2100_finish_trade_v3_fullobs_from_best
checkpoint_every_minutes: 15.0
