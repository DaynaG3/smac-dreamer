# R2 3v2 standard-units mixed curriculum - finish_trade_v3 reward, FULL resume from the best
# r2_2100 finish_trade_v3 checkpoint (best556). Curriculum bridge between the simple 2v1 set and
# the full r2_2100 mixed distribution.
#
#   python scripts/train_r2dreamer_smaclite_multimap.py \
#       --config configs/r2_3v2_standard_units_finish_trade_v3_from_best556.yaml \
#       --resume logs/r2dreamer/r2_2100_finish_trade_v3_from_best52/best_val_macro_winrate.pt \
#       --resume-mode full --steps 1000000 \
#       --logdir logs/r2dreamer/r2_3v2_standard_units_finish_trade_v3_from_best556
#
# NOTE ON COMPOSITION: this is a 3v2 (3 allies vs 2 enemies) ALLY-ADVANTAGED dataset -- the only
# standard-units mixed curriculum present in the repo. It is NOT the outnumbered 2v3 set (that
# dataset does not exist). 3v2 is a controlled, easier-than-r2_2100 mixed-unit matchup over the 5
# standard combat units {STALKER, ZEALOT, MARINE, MARAUDER, ZERGLING}.
#
# Reward, gamma (0.997), max_episode_steps (200), model, structured observation, and action space
# are UNCHANGED vs r2_2100_finish_trade_v3.yaml, so resume with --resume-mode full (world model +
# actor + reward/value heads + optimizer all restored). Only the map distribution, sampler, W&B
# identity, and logdir change. Checkpoint selection still uses ORIGINAL (unshaped) macro win rate.
#
# PADDING (critical): pinned to the r2_2100 TRAIN-max the best556 checkpoint was built against
# (max_agents=9 / max_enemies=10 / max_actions=16 / max_obs_size=255). The 3v2 dataset alone would
# infer much smaller TRAIN-max dims (3/2/8) and produce checkpoint-incompatible obs/action shapes;
# the explicit override keeps the model shape identical so `full` resume loads cleanly. Every 3v2
# map fits (3<=9, 2<=10, 8<=16).

maps:
  train:      configs/maps/r2_smaclite_3v2_basic_mixed_480_configs/configs/train
  validation: configs/maps/r2_smaclite_3v2_basic_mixed_480_configs/configs/validation
  blind_iid:  configs/maps/r2_smaclite_3v2_basic_mixed_480_configs/configs/blind_iid
  # no blind_compositional split in this dataset

# ---- Padding: pinned to the best556 (r2_2100) checkpoint shape - DO NOT let 3v2 shrink it ----
padding:
  max_agents: 9
  max_enemies: 10
  max_actions: 16
  max_obs_size: 255

# ---- Sampling: simple uniform coverage first (no sampler bias for the 3v2 adaptation test) ----
sampling_mode: shuffled_round_robin

map_priority:
  enabled: false

# ---- Observation representation -------------------------------------------
observation:
  mode: structured

# ---- Action masking (P0.1 real; P0.2 imagined) ----------------------------
action_masking: true
mask_threshold: 0.7

# ---- Reward: finish_trade_v3 (unchanged from r2_2100_finish_trade_v3.yaml) --
reward:
  name: finish_trade_v3
  params:
    w_enemy_progress: 0.28
    w_ally_loss: 0.22

    progress_eps: 0.0005
    stall_grace: 10
    stall_cap: 50
    w_stall: 0.020

    w_timeout_enemy: 1.10
    w_timeout_alive: 0.30

    w_win_speed: 0.35
    w_win_ally_ehp: 0.60

    w_all_dead_loss: 0.90
    w_unfinished_close_loss: 0.20

# ---- Run / model knobs (GPU production) -----------------------------------
device: cuda:0
amp_dtype: bfloat16                     # A40/A100/L4. Use float16 on T4/V100.
seed: 0
gamma: 0.997
steps: 4000000                          # override with --steps for the pilot
env_num: 8
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15

# ---- Validation (checkpoint selection): map x fixed seeds - UNBIASED -------
validation:
  every: 250000
  run_at_start: true
  seeds: [0, 1, 2]

# ---- Replay buffer: large capacity, CPU storage (model computes on cuda) ---
buffer:
  max_size: 1000000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay

# ---- Environment worker lifecycle / memory telemetry ----------------------
env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true

system_log_every: 10000

# ---- Logging --------------------------------------------------------------
wandb:
  project: smac-r2dreamer
  entity: null
  mode: online
  tags: [r2_3v2, standard_units, curriculum, smaclite, multimap, finish_trade_v3, from_best556]
  run_name: r2_3v2_standard_units_finish_trade_v3_from_best556
logdir: logs/r2dreamer/r2_3v2_standard_units_finish_trade_v3_from_best556
checkpoint_every_minutes: 15.0
