# R2-650 with the adaptive HARD-MAP curriculum enabled.
#
#   python scripts/train_r2dreamer_smaclite_multimap.py --config configs/r2_650_prioritized_hard_maps.yaml
#
# Identical to configs/r2_650.yaml except the env map sampler oversamples maps the policy is
# currently bad at. Sampling is a mixture: 75% baseline shuffled_round_robin coverage + 25%
# hard-map priority. Per-map difficulty is measured from TRAINING rollouts (EMA) as
#   hard_score = 0.60*(1 - win_rate) + 0.25*final_enemy_ehp_frac + 0.15*timeout_rate
# Validation stays FIXED and UNBIASED (held-out maps, fixed seeds) — the curriculum never
# touches evaluation. To disable, set map_priority.enabled:false and sampling_mode back to
# shuffled_round_robin.

maps:
  train:               configs/maps/r2_650/configs/train
  validation:          configs/maps/r2_650/configs/validation
  blind_iid:           configs/maps/r2_650/configs/blind_iid
  blind_compositional: configs/maps/r2_650/configs/blind_compositional

sampling_mode: prioritized_hard_maps    # 75% shuffled_round_robin + 25% hard-map oversampling

# ---- Adaptive hard-map curriculum -----------------------------------------
map_priority:
  enabled: true
  hard_map_probability: 0.25            # mixture weight on the hard-map component
  every: 100000                         # env steps between hard-score recomputes/broadcasts
  warmup: 100000                        # pure baseline sampling before the first broadcast
  ema_decay: 0.98                       # per-episode EMA smoothing of per-map outcomes
  min_episodes: 5                       # episodes a map needs before it joins the hard component

# ---- Observation representation -------------------------------------------
observation:
  mode: structured

# ---- Action masking (P0.1 real; P0.2 imagined) ----------------------------
action_masking: true
mask_threshold: 0.7

# ---- Reward ---------------------------------------------------------------
reward:
  name: smaclite_default
  params: {}

# ---- Run / model knobs (GPU production) -----------------------------------
device: cuda:0
amp_dtype: bfloat16
seed: 0
gamma: 0.997
steps: 2000000
env_num: 8
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15

# ---- Validation (checkpoint selection): map × fixed seeds — UNBIASED -------
validation:
  every: 100000
  run_at_start: false
  seeds: [0, 1, 2]

# ---- Replay buffer --------------------------------------------------------
buffer:
  max_size: 500000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay

# ---- Environment worker lifecycle / memory telemetry ----------------------
env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true

system_log_every: 10000

# ---- Logging --------------------------------------------------------------
wandb:
  project: smac-r2dreamer
  entity: null
  mode: online
  tags: [r2_650, smaclite, multimap, prioritized_hard_maps]
  run_name: null
logdir: logs/r2dreamer/r2_650_prioritized_hard_maps
checkpoint_every_minutes: 15.0
