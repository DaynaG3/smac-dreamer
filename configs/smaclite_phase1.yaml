smaclite_phase1:
  task: smaclite_2s3z
  script: train
  jax:
    platform: cpu
    prealloc: false
  logger:
    outputs: [jsonl]
  run:
    envs: 1
    steps: 50000
    log_every: 30
    save_every: 120
    train_ratio: 8
    debug: false
  env:
    smaclite:
      scenario: 2s3z
      max_episode_steps: 200
      seed: 42
  logdir: logs/smaclite_phase1
