smaclite_phase4:
  task: smaclite_phase4
  script: train
  jax:
    platform: cpu
    prealloc: false
  logger:
    outputs: [jsonl, wandb]
  run:
    envs: 1
    steps: 1000000
    log_every: 60
    save_every: 300
    train_ratio: 8
    debug: false
  env:
    smaclite:
      scenario: 2s3z
      max_episode_steps: 200
      seed: 0
      dataset_manifest: configs/maps/phase4_manifest.yaml
      manifest_split: train
      map_mode: shuffled_round_robin
      map_seed: 42
      use_padding: true
      reward_shaping:
        enabled: false
  wandb:
    project: smac-dreamer
    group: phase4-generalisation
    mode: online
  logdir: logs/smaclite_phase4

size1m:
  run:
    steps: 1000000

size5m:
  run:
    steps: 5000000
