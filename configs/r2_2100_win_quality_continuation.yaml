# Reward-transfer continuation: r2_650, win_quality_v5, 2M -> 4M.
#
# Continues a model that already trained 2,000,000 steps for another 2,000,000 LOCAL steps,
# changing ONLY the reward (smaclite_default -> win_quality_v5). The checkpoint path is supplied
# on the CLI (never hard-coded here); it lives on the Kubeflow persistent volume:
#
#   python scripts/train_r2dreamer_smaclite_multimap.py \
#       --config configs/r2_650_win_quality_continuation.yaml \
#       --resume /mnt/pvc/checkpoints/r2_650/best_val_macro_winrate.pt \
#       --resume-mode transfer_reward
#
# transfer_reward retains encoder/RSSM/actor/cont/mask-heads, resets reward+critic+slow-critic+
# return-EMA, and restores NO optimizer state. The actor is frozen for the first 25k local steps
# while the new critic/reward recalibrate.

maps:
  train:               configs/maps/r2_2100/configs/train
  validation:          configs/maps/r2_2100/configs/validation
  blind_iid:           configs/maps/r2_2100/configs/blind_iid
  blind_compositional: configs/maps/r2_2100/configs/blind_compositional

sampling_mode: shuffled_round_robin

observation:
  mode: structured

action_masking: true
mask_threshold: 0.7

# ---- Reward: win_quality_v5 (the only change vs the 2M run) ----
reward:
  name: win_quality_v5
  params:
    w_ally_ehp_dense: 0.25
    w_win_ehp: 0.50
    w_win_alive: 0.25
    w_timeout: 0.10

# ---- Run / model knobs (UNCHANGED from r2_650) ----
device: cuda:0
amp_dtype: bfloat16
seed: 0
gamma: 0.997
steps: 2000000          # 2M LOCAL continuation steps (global 2M -> 4M)
env_num: 8
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15

# ---- Continuation: reward transfer + actor warm-up + global-step offset ----
resume:
  mode: transfer_reward   # overridable via --resume-mode
  step_offset: 2000000    # global_step = local + 2,000,000  (overridable via --step-offset)
  actor_warmup_steps: 25000  # local steps with no actor updates (overridable via --actor-warmup-steps)

# ---- Validation (UNCHANGED): every 100k LOCAL steps -> global 2.1M, 2.2M, ... ----
validation:
  every: 100000
  run_at_start: false
  seeds: [0, 1, 2]

# ---- Replay (UNCHANGED) ----
buffer:
  max_size: 500000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay

env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true

system_log_every: 10000

# ---- Logging ----
wandb:
  project: smac-r2dreamer
  entity: null
  mode: online
  tags:
    - r2_650
    - win_quality_v5
    - reward_transfer
    - continuation_2m_to_4m
  run_name: null
logdir: logs/r2dreamer/r2_650_win_quality_continuation
checkpoint_every_minutes: 15.0
