smaclite_phase2:
  task: smaclite_phase2
  script: train
  jax:
    platform: cpu
    prealloc: false
  logger:
    outputs: [jsonl, wandb]
  run:
    envs: 1
    steps: 50000
    log_every: 30
    save_every: 120
    train_ratio: 8
    debug: false
  env:
    smaclite:
      scenario: 2s3z
      max_episode_steps: 200
      seed: 0
      map_manifest: configs/maps/phase2_manifest.yaml
      map_mode: round_robin
      map_seed: 42
  logdir: logs/smaclite_phase2
